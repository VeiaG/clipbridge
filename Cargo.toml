[package]
name = "clipbridge"
version = "0.2.1"
edition = "2024"
description = "Lightweight LAN clipboard sync tray app"
publish = false

[lib]
name = "clipbridge"
path = "src/lib.rs"

[[bin]]
name = "clipbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.6.0"
auto-launch = "0.6.0"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
clipboard-master = "4.0.0"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
mdns-sd = "0.21.5"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Crypto and PNG are painfully slow unoptimized; keep debug builds and tests snappy.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
blake3.opt-level = 3
chacha20.opt-level = 3
poly1305.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
miniz_oxide.opt-level = 3
crc32fast.opt-level = 3
image.opt-level = 3

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only for the settings window's activation policy; same version eframe uses.
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1.34"
