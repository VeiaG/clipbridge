[package]
name = "release-sign"
version = "0.1.0"
edition = "2024"
description = "Signs ClipBridge release manifests for the auto-updater"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
ed25519-dalek = "3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
